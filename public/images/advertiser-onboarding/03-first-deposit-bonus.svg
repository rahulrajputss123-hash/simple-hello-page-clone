<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">First deposit bonus</title><desc id="desc">Glossy jade campaign wallet with a golden bonus gift, coins, and a percentage medallion.</desc>
<defs><radialGradient id="halo"><stop stop-color="#B8F4DA" stop-opacity=".7"/><stop offset="1" stop-color="#B8F4DA" stop-opacity="0"/></radialGradient><linearGradient id="jade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80E8BA"/><stop offset=".46" stop-color="#1B9D76"/><stop offset="1" stop-color="#06493E"/></linearGradient><linearGradient id="jadeDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1B8064"/><stop offset="1" stop-color="#063B33"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#FFF4B9"/><stop offset=".38" stop-color="#F6D064"/><stop offset=".75" stop-color="#D79A2B"/><stop offset="1" stop-color="#965A14"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<ellipse cx="360" cy="300" rx="300" ry="290" fill="url(#halo)"/><ellipse cx="360" cy="541" rx="205" ry="30" fill="#06382F" opacity=".24" filter="url(#shadow)"/>
<!-- percentage medal --> <g transform="translate(507 182) rotate(12)"><circle r="74" fill="#8E5816" cy="7"/><circle r="74" fill="url(#gold)" stroke="#FFF0A7" stroke-width="5"/><circle r="57" fill="none" stroke="#BD7D20" stroke-width="4"/><text x="0" y="18" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="800" fill="#875112">%</text><path d="M-18 -42 18 42" stroke="#FFF0B0" stroke-width="6" stroke-linecap="round"/></g>
<!-- wallet body --> <g transform="rotate(-7 350 380)"><rect x="186" y="285" width="340" height="220" rx="35" fill="#063F36"/><rect x="177" y="270" width="340" height="220" rx="35" fill="url(#jade)" stroke="#9CF0C8" stroke-width="5"/><path d="M190 300Q200 280 230 280H467Q500 280 510 308V330H190Z" fill="#B8F7D9" opacity=".35"/><rect x="386" y="340" width="153" height="88" rx="22" fill="url(#jadeDark)" stroke="#8AE8BD" stroke-width="4"/><circle cx="418" cy="384" r="10" fill="url(#gold)"/><path d="M211 362h125M211 389h90" stroke="#D7FFEC" stroke-width="9" stroke-linecap="round" opacity=".8"/></g>
<!-- bonus gift --> <g transform="translate(270 175) rotate(5)"><path d="M-74 15 0 -25 78 12 4 54Z" fill="#0A624F" stroke="#A1F2CE" stroke-width="4"/><path d="M-68 20 4 56 4 174 -68 137Z" fill="url(#jade)" stroke="#9CF0C8" stroke-width="4"/><path d="M4 56 72 19 72 137 4 174Z" fill="url(#jadeDark)" stroke="#0A5A48" stroke-width="4"/><path d="M-68 20 4 56 72 19 0 -16Z" fill="#4CCB99" stroke="#B9F8D8" stroke-width="4"/><path d="M-7 -13 15 -1 15 164 -7 153Z" fill="url(#gold)"/><path d="M-2 -14C-45 -70 -84 -34 -48 -11L3 18Z" fill="url(#gold)" stroke="#FFF0A7" stroke-width="4"/><path d="M8 -17C34 -71 78 -40 48 -14L5 18Z" fill="url(#gold)" stroke="#FFF0A7" stroke-width="4"/><ellipse cx="4" cy="-3" rx="17" ry="14" fill="#F7D76E" stroke="#FFF0A7" stroke-width="4"/></g>
<!-- coins --> <g transform="translate(172 465) rotate(-12)"><ellipse cy="14" rx="40" ry="13" fill="#8D5817"/><path d="M-40 0v14c0 7 18 14 40 14s40-7 40-14V0" fill="#C58A27"/><ellipse cy="0" rx="40" ry="13" fill="url(#gold)" stroke="#FFF0A7" stroke-width="3"/><ellipse rx="26" ry="7" fill="none" stroke="#B77B1D" stroke-width="3"/><path d="M-6 -7h12M0 -7v14M-6 7h12" stroke="#9A6419" stroke-width="3"/></g>
<g fill="#FFF0AE" filter="url(#glow)"><path d="M143 218l7 20 20 7-20 7-7 20-7-20-20-7 20-7Z"/><path d="M556 337l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z"/><path d="M382 104l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z"/></g><circle cx="570" cy="451" r="6" fill="#F6D36A"/><circle cx="216" cy="155" r="5" fill="#F6D36A"/>
</svg>
