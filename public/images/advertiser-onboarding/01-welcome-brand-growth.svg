<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">Welcome to CashGPT advertiser onboarding</title><desc id="desc">Glossy jade gift box with gold coins, floating sparkles, and a growth arrow.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#B7F1D6" stop-opacity=".65"/><stop offset="1" stop-color="#B7F1D6" stop-opacity="0"/></radialGradient>
 <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71E0B2"/><stop offset=".45" stop-color="#138A6A"/><stop offset="1" stop-color="#064E43"/></linearGradient>
 <linearGradient id="jadeLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B7FFE1"/><stop offset=".55" stop-color="#39BC8B"/><stop offset="1" stop-color="#08745C"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#FFF2B0"/><stop offset=".35" stop-color="#F7CF62"/><stop offset=".72" stop-color="#D99A28"/><stop offset="1" stop-color="#9C5E12"/></linearGradient>
 <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DFA334"/><stop offset="1" stop-color="#925515"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="360" cy="310" rx="300" ry="290" fill="url(#halo)"/>
<ellipse cx="366" cy="542" rx="190" ry="30" fill="#062D27" opacity=".25" filter="url(#shadow)"/>
<!-- floating orbit --> <ellipse cx="355" cy="324" rx="246" ry="155" fill="none" stroke="#EAC45B" stroke-width="2" stroke-dasharray="3 14" opacity=".55" transform="rotate(-18 355 324)"/>
<!-- growth arrow --> <path d="M488 230 L530 187 L555 211 L605 144" fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M579 145h27v27" fill="none" stroke="#FCE9A0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<!-- coins -->
<g transform="translate(177 365) rotate(-16)"><ellipse cx="0" cy="18" rx="45" ry="15" fill="#8D5817"/><path d="M-45 0v18c0 9 20 16 45 16s45-7 45-16V0" fill="url(#goldSide)"/><ellipse cy="0" rx="45" ry="15" fill="url(#gold)" stroke="#FFF0A7" stroke-width="3"/><ellipse cy="0" rx="30" ry="9" fill="none" stroke="#C18320" stroke-width="3"/><path d="M-8 -8h16M0 -8v16M-8 8h16" stroke="#A56A18" stroke-width="3" stroke-linecap="round"/></g>
<g transform="translate(535 377) rotate(18) scale(.8)"><ellipse cy="16" rx="45" ry="15" fill="#8D5817"/><path d="M-45 0v16c0 9 20 16 45 16s45-7 45-16V0" fill="url(#goldSide)"/><ellipse cy="0" rx="45" ry="15" fill="url(#gold)" stroke="#FFF0A7" stroke-width="3"/><ellipse cy="0" rx="30" ry="9" fill="none" stroke="#C18320" stroke-width="3"/><path d="M-8 -8h16M0 -8v16M-8 8h16" stroke="#A56A18" stroke-width="3" stroke-linecap="round"/></g>
<!-- gift lid --> <g transform="rotate(-5 356 280)"><path d="M244 264 355 205 474 261 361 322Z" fill="#0C6A55" stroke="#9BF2CC" stroke-width="4"/><path d="M355 205v117" stroke="#F6D46D" stroke-width="22"/><path d="M244 264 361 322 474 261" fill="none" stroke="#0A4E42" stroke-width="5"/>
<!-- box front --> <path d="M252 282 360 337 360 477 252 420Z" fill="url(#jadeLight)" stroke="#9AF0C9" stroke-width="4"/><path d="M360 337 462 285 462 423 360 477Z" fill="url(#jade)" stroke="#0A6A53" stroke-width="4"/><path d="M339 326 382 305 382 465 339 488Z" fill="url(#gold)"/><path d="M252 282 360 337 462 285 355 234Z" fill="#4CC99B" stroke="#B9F8D8" stroke-width="4"/><path d="M338 242 378 261 379 319 338 298Z" fill="url(#gold)"/><path d="M358 248 378 261 399 250 379 239Z" fill="#FFF0A5"/>
<!-- ribbon bow --> <path d="M357 243C310 180 255 205 294 237L357 267Z" fill="url(#gold)" stroke="#FFF0A5" stroke-width="4"/><path d="M379 239C410 176 469 199 433 232L379 267Z" fill="url(#gold)" stroke="#FFF0A5" stroke-width="4"/><ellipse cx="368" cy="252" rx="20" ry="17" fill="#F6D46D" stroke="#FFF1AC" stroke-width="4"/></g>
<!-- sparkles --> <g fill="#FFF1B4" filter="url(#glow)"><path d="M168 209l8 24 24 8-24 8-8 24-8-24-24-8 24-8Z"/><path d="M514 446l6 17 17 6-17 6-6 17-6-17-17-6 17-6Z"/><path d="M268 124l5 15 15 5-15 5-5 15-5-15-15-5 15-5Z"/></g>
<circle cx="558" cy="281" r="8" fill="#FFF1B4"/><circle cx="206" cy="469" r="6" fill="#FFF1B4"/><circle cx="449" cy="118" r="5" fill="#FFF1B4"/>
</svg>
