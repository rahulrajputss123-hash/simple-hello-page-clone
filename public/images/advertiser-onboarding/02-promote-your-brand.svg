<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">Promote your brand</title><desc id="desc">Glossy jade megaphone, rising analytics bars, and gold engagement tokens.</desc>
<defs><radialGradient id="halo"><stop stop-color="#B8F4DA" stop-opacity=".7"/><stop offset="1" stop-color="#B8F4DA" stop-opacity="0"/></radialGradient><linearGradient id="jade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8BF0C4"/><stop offset=".5" stop-color="#21A77D"/><stop offset="1" stop-color="#075446"/></linearGradient><linearGradient id="jadeDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#187D63"/><stop offset="1" stop-color="#063E36"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF2B1"/><stop offset=".42" stop-color="#F6CC5B"/><stop offset="1" stop-color="#B8751A"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<ellipse cx="360" cy="306" rx="305" ry="290" fill="url(#halo)"/><ellipse cx="370" cy="544" rx="210" ry="27" fill="#063C33" opacity=".22" filter="url(#shadow)"/>
<!-- rising chart --> <g transform="translate(390 210) rotate(-7)"><rect x="0" y="140" width="47" height="126" rx="13" fill="#13765D"/><rect x="62" y="92" width="47" height="174" rx="13" fill="#23A77D"/><rect x="124" y="35" width="47" height="231" rx="13" fill="url(#jade)"/><path d="M8 124 72 79 128 24 174 4" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M147 4h27v27" fill="none" stroke="#FCE9A0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- floating engagement cards --> <g transform="translate(470 105) rotate(8)"><rect width="116" height="62" rx="18" fill="#F8F5E9" stroke="#E3BD55" stroke-width="3"/><circle cx="31" cy="31" r="17" fill="url(#gold)"/><path d="M31 20v22M20 31h22" stroke="#9C6318" stroke-width="4" stroke-linecap="round"/><rect x="57" y="22" width="42" height="7" rx="3.5" fill="#148567"/><rect x="57" y="35" width="30" height="6" rx="3" fill="#A7C9B7"/></g>
<!-- megaphone mouth --> <g transform="rotate(-18 318 335)"><path d="M290 260 457 211 457 386 290 344Z" fill="url(#jade)" stroke="#B0F8D8" stroke-width="5"/><path d="M457 211 514 232 514 364 457 386Z" fill="url(#jadeDark)" stroke="#0B5C49" stroke-width="4"/><path d="M304 276 435 238 435 359 304 329Z" fill="#D9FFF0" opacity=".3"/><path d="M286 274 236 286 236 333 286 345Z" fill="url(#gold)" stroke="#FFF1B1" stroke-width="4"/><path d="M259 332 300 342 322 425Q323 437 310 440L278 442Q267 442 264 431Z" fill="url(#jadeDark)" stroke="#8BE6BE" stroke-width="4"/><path d="M277 347 302 353 315 415 292 418Z" fill="#21A77D"/><path d="M284 263 457 211 457 234 290 283Z" fill="#B2F7D8" opacity=".75"/></g>
<!-- sound waves --> <path d="M193 260Q163 295 192 329M164 239Q120 295 164 351M137 216Q78 295 137 376" fill="none" stroke="#E9B944" stroke-width="8" stroke-linecap="round" opacity=".9"/>
<!-- coin --> <g transform="translate(196 431) rotate(-12)"><ellipse cy="13" rx="39" ry="13" fill="#925C18"/><path d="M-39 0v13c0 7 17 13 39 13s39-6 39-13V0" fill="#C48A26"/><ellipse cy="0" rx="39" ry="13" fill="url(#gold)" stroke="#FFF1B1" stroke-width="3"/><ellipse rx="25" ry="7" fill="none" stroke="#B77C1E" stroke-width="3"/><path d="M-6 -7h12M0 -7v14M-6 7h12" stroke="#9A6419" stroke-width="3"/></g>
<g fill="#FFF0AE" filter="url(#glow)"><path d="M194 140l7 20 20 7-20 7-7 20-7-20-20-7 20-7Z"/><path d="M562 410l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z"/><path d="M380 111l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z"/></g><circle cx="565" cy="490" r="6" fill="#F6D36A"/><circle cx="226" cy="195" r="5" fill="#F6D36A"/>
</svg>
